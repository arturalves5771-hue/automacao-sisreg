<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automação SISREG</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f4;
            color: #1f2937;
        }

        .container {
            width: min(900px, 92%);
            margin: 50px auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px 0;
            color: #166534;
            font-size: 30px;
        }

        .subtitulo {
            margin-bottom: 30px;
            color: #6b7280;
        }

        .status {
            padding: 14px 18px;
            border-radius: 10px;
            background: #f3f4f6;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .status.conectado {
            background: #dcfce7;
            color: #166534;
        }

        .status.erro {
            background: #fee2e2;
            color: #991b1b;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            background: #166534;
            color: white;
        }

        .btn-login:hover {
            background: #14532d;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .painel {
            display: none;
        }

        .painel.visivel {
            display: block;
        }

        .titulo-painel {
            font-size: 22px;
            margin: 0 0 20px 0;
        }

        .exportacao {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 22px;
            background: #fafafa;
        }

        .datas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .btn-exportar {
            margin-top: 5px;
            background: #15803d;
            color: white;
        }

        .btn-exportar:hover {
            background: #166534;
        }

        .btn-exportar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .mensagem {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .mensagem.sucesso {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .mensagem.erro {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .login-area {
            max-width: 450px;
            margin: auto;
        }

        .oculto {
            display: none !important;
        }


        /* Estilos isolados da consulta CNS/CPF */
        .consulta-cns input {
            margin-bottom: 12px;
        }

        .consulta-cns .btn-exportar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .acoes-consulta-cns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: stretch;
        }

        .acoes-consulta-cns button {
            flex: 1 1 180px;
            margin-top: 0;
        }

        .btn-copiar-cns:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #6b7280;
        }

        .resumo-paciente-cns {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #ffffff;
        }

        .resumo-paciente-cns .linha-principal {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .resumo-paciente-cns .nome-paciente {
            color: #111827;
            font-size: 18px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .resumo-paciente-cns .cartao-sus {
            color: #15803d;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .resumo-paciente-cns .nome-mae {
            display: block;
            margin-top: 7px;
            color: #6b7280;
            font-size: 13px;
        }

        .resultado-cns {
            margin-top: 16px;
            padding: 16px;
            max-height: 420px;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
            color: #1f2937;
            font: 13px/1.5 Consolas, "Courier New", monospace;
        }

        @media (max-width: 600px) {
            .datas {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- FORMULÁRIO DE LOGIN -->
    <div class="card" id="cardLogin">
        <form class="login-area" id="formLogin" action="javascript:void(0);">
            <h1>Automação SISREG</h1>
            <div class="subtitulo">Acesso ao sistema</div>
            <div style="font-size: 13px; color: #9ca3af; margin-top: -20px; margin-bottom: 24px;">
                Versão 1.6
            </div>

            <div class="status" id="status">
                🔴 SISREG desconectado
            </div>

            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="username" autocomplete="username" placeholder="Digite seu usuário" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="password" autocomplete="current-password" placeholder="Digite sua senha" required>

            <button type="submit" class="btn-login" id="btnLogin">
                ENTRAR NO SISREG
            </button>
        </form>
    </div>

    <!-- PAINEL -->
    <div class="card painel" id="painel">
        <h1>Automação SISREG</h1>
        <div class="subtitulo">Painel de automação</div>

        <div class="status conectado" id="statusPainel">
            🟢 SISREG conectado
        </div>

        <!-- PASTA DE DESTINO -->
        <div class="exportacao" style="margin-bottom: 18px;">
            <div class="titulo-painel">
                📁 Pasta de destino do CSV
            </div>

            <button class="btn-exportar" id="btnSelecionarPasta" type="button">
                SELECIONAR PASTA
            </button>

            <div class="mensagem" id="statusPasta" style="display: block; margin-top: 12px;">
                ⚠️ Nenhuma pasta configurada.
            </div>
        </div>

        <!-- EXPORTAÇÃO -->
        <div class="exportacao">
            <div class="titulo-painel">
                📅 Exportação de Agenda
            </div>

            <div class="datas">
                <div>
                    <label for="dataInicial">Data inicial</label>
                    <input type="date" id="dataInicial">
                </div>

                <div>
                    <label for="dataFinal">Data final</label>
                    <input type="date" id="dataFinal">
                </div>
            </div>

            <button class="btn-exportar" id="btnExportar">
                EXPORTAR CSV
            </button>

            <div class="mensagem" id="mensagem"></div>
        </div>

        <!-- CONSULTA POR CNS / CPF (MÓDULO ADICIONAL) -->
        <div class="exportacao consulta-cns" id="secaoConsultaCNS" style="margin-top: 18px;">
            <div class="titulo-painel">🔎 Consulta por CNS / CPF</div>
            <label for="numeroConsultaCNS">Cartão Nacional de Saúde (CNS) ou CPF</label>
            <input type="text" id="numeroConsultaCNS" inputmode="numeric" autocomplete="off"
                maxlength="18" placeholder="Digite o CNS ou CPF (somente números)">
            <div class="acoes-consulta-cns">
                <button class="btn-exportar" id="btnConsultarCNS" type="button">CONSULTAR DADOS</button>
                <button class="btn-exportar btn-copiar-cns" id="btnCopiarDadosCNS" type="button" disabled>📋 COPIAR INFORMAÇÕES</button>
            </div>
            <div class="mensagem" id="mensagemConsultaCNS" role="status" aria-live="polite"></div>
            <div id="resumoPacienteCNS" class="resumo-paciente-cns oculto" aria-live="polite">
                <div class="linha-principal">
                    <span id="nomePacienteCNS" class="nome-paciente"></span>
                    <span id="cartaoSUSCNS" class="cartao-sus"></span>
                </div>
                <span id="nomeMaeCNS" class="nome-mae"></span>
            </div>
            <pre id="resultadoConsultaCNS" class="resultado-cns oculto"></pre>
        </div>
    </div>

</div>

<script>
/*
=========================================================
ELEMENTOS
=========================================================
*/
const cardLogin = document.getElementById("cardLogin");
const formLogin = document.getElementById("formLogin");
const painel = document.getElementById("painel");
const usuario = document.getElementById("usuario");
const senha = document.getElementById("senha");
const btnLogin = document.getElementById("btnLogin");
const status = document.getElementById("status");
const dataInicial = document.getElementById("dataInicial");
const dataFinal = document.getElementById("dataFinal");
const btnExportar = document.getElementById("btnExportar");
const mensagem = document.getElementById("mensagem");
const btnSelecionarPasta = document.getElementById("btnSelecionarPasta");
const statusPasta = document.getElementById("statusPasta");
/* Elementos exclusivos da consulta CNS/CPF */
const numeroConsultaCNS = document.getElementById("numeroConsultaCNS");
const btnConsultarCNS = document.getElementById("btnConsultarCNS");
const mensagemConsultaCNS = document.getElementById("mensagemConsultaCNS");
const resultadoConsultaCNS = document.getElementById("resultadoConsultaCNS");
const resumoPacienteCNS = document.getElementById("resumoPacienteCNS");
const nomePacienteCNS = document.getElementById("nomePacienteCNS");
const cartaoSUSCNS = document.getElementById("cartaoSUSCNS");
const nomeMaeCNS = document.getElementById("nomeMaeCNS");
const btnCopiarDadosCNS = document.getElementById("btnCopiarDadosCNS");

let pastaSISREG = null;
const DB_NOME = "AutomacaoSISREG";
const DB_VERSAO = 1;
const DB_STORE = "configuracoes";
const DB_CHAVE_PASTA = "pastaSISREG";

/*
=========================================================
INICIALIZAÇÃO E TECLA ENTER
=========================================================
*/
document.addEventListener("DOMContentLoaded", async function () {
    carregarDatasPadrao();
    if (usuario) usuario.focus();
    await inicializarPastaSISREG();
});

// Ao pressionar Enter no usuário, foca na senha
usuario.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        event.preventDefault();
        senha.focus();
    }
});

/*
=========================================================
PASTA DE DESTINO DO CSV
=========================================================
*/
function abrirBancoDados() {
    return new Promise(function (resolve, reject) {
        const request = indexedDB.open(DB_NOME, DB_VERSAO);

        request.onupgradeneeded = function () {
            const db = request.result;
            if (!db.objectStoreNames.contains(DB_STORE)) {
                db.createObjectStore(DB_STORE);
            }
        };

        request.onsuccess = function () {
            resolve(request.result);
        };

        request.onerror = function () {
            reject(request.error);
        };
    });
}

async function salvarHandlePasta(handle) {
    const db = await abrirBancoDados();

    return new Promise(function (resolve, reject) {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(handle, DB_CHAVE_PASTA);

        tx.oncomplete = function () {
            db.close();
            resolve();
        };

        tx.onerror = function () {
            db.close();
            reject(tx.error);
        };
    });
}

async function carregarHandlePasta() {
    const db = await abrirBancoDados();

    return new Promise(function (resolve, reject) {
        const tx = db.transaction(DB_STORE, "readonly");
        const request = tx.objectStore(DB_STORE).get(DB_CHAVE_PASTA);

        request.onsuccess = function () {
            db.close();
            resolve(request.result || null);
        };

        request.onerror = function () {
            db.close();
            reject(request.error);
        };
    });
}

async function verificarPermissaoPasta(handle, solicitar) {
    if (!handle) return false;

    const opcoes = { mode: "readwrite" };

    try {
        if (await handle.queryPermission(opcoes) === "granted") {
            return true;
        }

        if (solicitar && await handle.requestPermission(opcoes) === "granted") {
            return true;
        }
    } catch (erro) {
        console.error("Erro ao verificar permissão da pasta:", erro);
    }

    return false;
}

function atualizarStatusPasta(texto, tipo) {
    statusPasta.textContent = texto;
    statusPasta.className = "mensagem " + (tipo || "");
    statusPasta.style.display = "block";
}

async function inicializarPastaSISREG() {
    if (!window.showDirectoryPicker || !window.indexedDB) {
        atualizarStatusPasta(
            "❌ Este Chrome não oferece suporte à gravação direta em pasta.",
            "erro"
        );
        return;
    }

    try {
        pastaSISREG = await carregarHandlePasta();

        if (!pastaSISREG) {
            atualizarStatusPasta(
                "⚠️ Selecione a pasta de rede onde os CSVs serão salvos.",
                "erro"
            );
            return;
        }

        const permitida = await verificarPermissaoPasta(pastaSISREG, false);

        if (permitida) {
            atualizarStatusPasta(
                "✅ Pasta configurada: " + pastaSISREG.name,
                "sucesso"
            );
            btnSelecionarPasta.textContent = "ALTERAR PASTA";
        } else {
            atualizarStatusPasta(
                "🔐 A pasta " + pastaSISREG.name + " está cadastrada. Clique em \"Autorizar pasta\" para liberar a gravação.",
                "erro"
            );
            btnSelecionarPasta.textContent = "AUTORIZAR PASTA";
        }
    } catch (erro) {
        console.error("Erro ao carregar pasta SISREG:", erro);
        pastaSISREG = null;
        atualizarStatusPasta(
            "⚠️ Não foi possível recuperar a pasta configurada. Selecione novamente.",
            "erro"
        );
    }
}

btnSelecionarPasta.addEventListener("click", async function () {
    try {
        const novaPasta = await window.showDirectoryPicker({
            mode: "readwrite"
        });

        const permitida = await verificarPermissaoPasta(novaPasta, true);

        if (!permitida) {
            atualizarStatusPasta(
                "❌ Permissão de gravação não concedida.",
                "erro"
            );
            return;
        }

        pastaSISREG = novaPasta;
        await salvarHandlePasta(pastaSISREG);

        atualizarStatusPasta(
            "✅ Pasta configurada: " + pastaSISREG.name,
            "sucesso"
        );

        btnSelecionarPasta.textContent = "ALTERAR PASTA";
    } catch (erro) {
        if (erro && erro.name !== "AbortError") {
            console.error("Erro ao selecionar pasta:", erro);
            atualizarStatusPasta(
                "❌ Não foi possível configurar a pasta: " + erro.message,
                "erro"
            );
        }
    }
});

async function garantirPastaSISREG() {
    if (!pastaSISREG) {
        atualizarStatusPasta(
            "⚠️ Selecione a pasta de rede antes de exportar.",
            "erro"
        );
        return false;
    }

    const permitida = await verificarPermissaoPasta(pastaSISREG, true);

    if (!permitida) {
        atualizarStatusPasta(
            "❌ O Chrome não autorizou a gravação nessa pasta.",
            "erro"
        );
        return false;
    }

    return true;
}

async function salvarCSVNaPasta(dataUrl, nomeArquivo) {
    if (!pastaSISREG) {
        throw new Error("Pasta de destino não configurada.");
    }

    const resposta = await fetch(dataUrl);
    const blob = await resposta.blob();

    const arquivo = await pastaSISREG.getFileHandle(nomeArquivo, {
        create: true
    });

    const gravador = await arquivo.createWritable();
    await gravador.write(blob);
    await gravador.close();
}

/*
=========================================================
DATAS PADRÃO (HOJE+1 DIA E HOJE+7 DIAS)
=========================================================
*/
function formatarDataISO(data) {
    const ano = data.getFullYear();
    const mes = String(data.getMonth() + 1).padStart(2, '0');
    const dia = String(data.getDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
}

function carregarDatasPadrao() {
    const hoje = new Date();

    const dataIni = new Date(hoje);
    dataIni.setDate(dataIni.getDate() + 1);

    const dataFim = new Date(hoje);
    dataFim.setDate(dataFim.getDate() + 7);

    dataInicial.value = formatarDataISO(dataIni);
    dataFinal.value = formatarDataISO(dataFim);
}

/*
=========================================================
SUBMIT DO LOGIN (Ativa salvamento de senha no navegador)
=========================================================
*/
formLogin.addEventListener("submit", function (event) {
    event.preventDefault();

    const user = usuario.value.trim();
    const pass = senha.value;

    if (!user || !pass) {
        status.textContent = "⚠️ Informe usuário e senha.";
        status.className = "status erro";
        return;
    }

    status.textContent = "🟡 Conectando ao SISREG...";
    status.className = "status";
    btnLogin.disabled = true;

    window.postMessage({
        type: "SISREG_LOGIN",
        username: user,
        password: pass
    }, "*");
});

/*
=========================================================
RESPOSTAS DA EXTENSÃO
=========================================================
*/
window.addEventListener("message", function (event) {
    if (event.source !== window || !event.data) return;

    if (event.data.type === "LOGIN_SISREG_SUCESSO") {
        cardLogin.classList.add("oculto");
        painel.classList.add("visivel");
        return;
    }

    if (event.data.type === "LOGIN_SISREG_ERRO") {
        status.textContent = "✕ " + (event.data.mensagem || "Login ou senha incorreto(s).");
        status.className = "status erro";
        btnLogin.disabled = false;
        return;
    }

    if (event.data.type === "ARQUIVO_CSV_PRONTO") {
        salvarCSVNaPasta(event.data.dataUrl, event.data.nomeArquivo)
            .then(function () {
                atualizarStatusPasta(
                    "✅ Arquivo salvo em " + pastaSISREG.name,
                    "sucesso"
                );

                window.postMessage({
                    type: "ARQUIVO_SALVO_DIRETO",
                    nomeArquivo: event.data.nomeArquivo
                }, "*");
            })
            .catch(function (erro) {
                window.postMessage({
                    type: "ERRO_SALVAR_ARQUIVO",
                    mensagem: erro.message
                }, "*");
            });

        return;
    }

    if (event.data.type === "EXPORTACAO_SUCESSO") {
        btnExportar.disabled = false;
        btnExportar.textContent = "EXPORTAR CSV";
        mensagem.textContent = "✓ " + event.data.mensagem;
        mensagem.className = "mensagem sucesso";
        return;
    }

    if (event.data.type === "EXPORTACAO_ERRO") {
        btnExportar.disabled = false;
        btnExportar.textContent = "EXPORTAR CSV";
        mensagem.textContent = "✕ " + event.data.mensagem;
        mensagem.className = "mensagem erro";
        return;
    }
});

/*
=========================================================
EXPORTAR CSV
=========================================================
*/
btnExportar.addEventListener("click", async function () {
    if (!(await garantirPastaSISREG())) {
        return;
    }

    const inicial = dataInicial.value;
    const final = dataFinal.value;

    if (!inicial || !final) {
        mensagem.textContent = "Informe a data inicial e a data final.";
        mensagem.className = "mensagem erro";
        return;
    }

    if (inicial > final) {
        mensagem.textContent = "A data inicial não pode ser maior que a data final.";
        mensagem.className = "mensagem erro";
        return;
    }

    const partesInicial = inicial.split("-");
    const partesFinal = final.split("-");

    const dataInicialSISREG = partesInicial[2] + "/" + partesInicial[1] + "/" + partesInicial[0];
    const dataFinalSISREG = partesFinal[2] + "/" + partesFinal[1] + "/" + partesFinal[0];

    btnExportar.disabled = true;
    btnExportar.textContent = "EXPORTANDO...";
    mensagem.textContent = "⏳ Consultando o SISREG e preparando o arquivo...";
    mensagem.className = "mensagem sucesso";

    window.postMessage({
        type: "EXPORTAR_CSV",
        dataInicial: dataInicialSISREG,
        dataFinal: dataFinalSISREG
    }, "*");
});

/*
=========================================================
MÓDULO ADICIONAL: CONSULTA POR CNS / CPF
=========================================================
*/
function validarCPFConsulta(cpf) {
    if (!/^\d{11}$/.test(cpf) || /^(\d)\1{10}$/.test(cpf)) return false;

    let soma = 0;
    for (let i = 0; i < 9; i++) soma += Number(cpf[i]) * (10 - i);
    let digito = (soma * 10) % 11;
    if (digito === 10) digito = 0;
    if (digito !== Number(cpf[9])) return false;

    soma = 0;
    for (let i = 0; i < 10; i++) soma += Number(cpf[i]) * (11 - i);
    digito = (soma * 10) % 11;
    if (digito === 10) digito = 0;
    return digito === Number(cpf[10]);
}

function exibirMensagemConsultaCNS(texto, tipo) {
    mensagemConsultaCNS.textContent = texto;
    mensagemConsultaCNS.className = "mensagem " + (tipo || "");
}

btnCopiarDadosCNS.addEventListener("click", async function () {
    const texto = resultadoConsultaCNS.textContent;

    if (!texto.trim()) {
        exibirMensagemConsultaCNS("Não há informações para copiar.", "erro");
        return;
    }

    try {
        await navigator.clipboard.writeText(texto);
        exibirMensagemConsultaCNS("✅ Informações copiadas. Agora é só colar onde precisar.", "sucesso");
    } catch (erro) {
        exibirMensagemConsultaCNS("❌ O navegador não permitiu copiar. Selecione o texto do resultado e use Ctrl+C.", "erro");
    }
});

function normalizarRotuloCNS(valor) {
    return String(valor || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
}

function localizarValorCNS(dados, padroes) {
    const procurarEmCelulas = function (linhas) {
        for (const linha of (linhas || [])) {
            for (let i = 0; i < linha.length; i++) {
                const rotulo = normalizarRotuloCNS(linha[i]);
                if (padroes.some(function (padrao) { return padrao.test(rotulo); })) {
                    const valor = linha.slice(i + 1).find(function (item) { return String(item || "").trim(); });
                    if (valor) return String(valor).trim();
                }
            }
        }
        return "";
    };

    for (const tabela of (dados.tabelas || [])) {
        const valor = procurarEmCelulas(tabela);
        if (valor) return valor;
    }

    for (const campo of (dados.campos || [])) {
        const rotulo = normalizarRotuloCNS(campo.campo);
        if (padroes.some(function (padrao) { return padrao.test(rotulo); }) && String(campo.valor || "").trim()) {
            return String(campo.valor).trim();
        }
    }

    const linhasTexto = String(dados.texto || "").split(/\\r?\\n/).map(function (linha) { return linha.trim(); }).filter(Boolean);
    for (let i = 0; i < linhasTexto.length; i++) {
        const rotulo = normalizarRotuloCNS(linhasTexto[i]);
        if (padroes.some(function (padrao) { return padrao.test(rotulo); })) {
            const mesmaLinha = linhasTexto[i].split(/[:：]/).slice(1).join(":").trim();
            if (mesmaLinha) return mesmaLinha;
            if (linhasTexto[i + 1]) return linhasTexto[i + 1].trim();
        }
    }
    return "";
}

function extrairResumoDoTextoCNS(texto) {
    const clean = String(texto || "").replace(/\\r\\n/g, "\\n").replace(/\\r/g, "\\n");

    // Replica a lógica que já funcionava no conversor CADWEB enviado.
    let nome = "";
    const nomeBlock = clean.match(/Nome:\\s*Nome Social \/ Apelido:\\s*([\\s\\S]*?)(?=Nome da Mãe:)/i);
    if (nomeBlock) {
        const valor = nomeBlock[1].trim().replace(/\\n/g, " ");
        nome = valor.includes("---") ? valor.split("---")[0].trim() : valor;
    }

    let mae = "";
    const paisBlock = clean.match(/Nome da Mãe:\\s*Nome do Pai:\\s*([\\s\\S]*?)(?=Sexo:)/i);
    if (paisBlock) {
        const valor = paisBlock[1].trim().replace(/\\n/g, " ");
        const palavras = valor.split(/\\s+/).filter(Boolean);
        if (palavras.length >= 4) {
            const meio = Math.floor(palavras.length / 2);
            mae = palavras.slice(0, meio).join(" ");
        } else {
            mae = valor;
        }
    }

    const cnsMatch = clean.match(/CNS:\\s*(\\d{15})/i);
    return {
        nome: nome,
        mae: mae,
        cns: cnsMatch ? cnsMatch[1] : ""
    };
}

function exibirResumoPacienteCNS(dados) {
    const texto = dados && typeof dados.texto === "string" ? dados.texto : "";
    const resumoTexto = extrairResumoDoTextoCNS(texto);

    // O texto bruto do CADWEB é a fonte principal; as tabelas/campos ficam como reserva.
    const nome = resumoTexto.nome || localizarValorCNS(dados, [/^NOME(?: DO PACIENTE| DO USUARIO)?$/]);
    const cartao = resumoTexto.cns || localizarValorCNS(dados, [/^CNS$/, /CARTAO NACIONAL DE SAUDE/, /^NUMERO DO CARTAO SUS$/]);
    const mae = resumoTexto.mae || localizarValorCNS(dados, [/^NOME DA MAE$/, /^MAE$/]);

    nomePacienteCNS.textContent = nome || "Nome não identificado";
    cartaoSUSCNS.textContent = cartao ? "🟢 CNS: " + cartao : "🟢 Consulta realizada";
    nomeMaeCNS.textContent = mae ? "Mãe: " + mae : "";
    resumoPacienteCNS.classList.remove("oculto");
}

btnConsultarCNS.addEventListener("click", function () {
    const numero = numeroConsultaCNS.value.replace(/\D/g, "");

    if (numero.length !== 15 && numero.length !== 11) {
        exibirMensagemConsultaCNS("Informe um CNS com 15 dígitos ou um CPF com 11 dígitos.", "erro");
        return;
    }

    if (numero.length === 11 && !validarCPFConsulta(numero)) {
        exibirMensagemConsultaCNS("O CPF informado não é válido. Confira os números.", "erro");
        return;
    }

    resultadoConsultaCNS.textContent = "";
    resultadoConsultaCNS.classList.add("oculto");
    resumoPacienteCNS.classList.add("oculto");
    btnCopiarDadosCNS.disabled = true;
    btnConsultarCNS.disabled = true;
    btnConsultarCNS.textContent = "CONSULTANDO...";
    exibirMensagemConsultaCNS("⏳ Abrindo o SISREG e realizando a consulta. Aguarde...", "sucesso");

    window.postMessage({
        type: "CONSULTAR_DADOS_CNS",
        numero: numero
    }, "*");
});

/* Canal independente: não interfere no listener já utilizado pelo CSV/login. */
window.addEventListener("message", function (event) {
    if (event.source !== window || !event.data) return;

    if (event.data.type === "DADOS_CNS_SUCESSO") {
        btnConsultarCNS.disabled = false;
        btnConsultarCNS.textContent = "CONSULTAR DADOS";
        exibirMensagemConsultaCNS("✅ Consulta concluída. Confira os dados abaixo.", "sucesso");

        const dados = event.data.jsonData;
        resultadoConsultaCNS.textContent = JSON.stringify(dados, null, 2);
        exibirResumoPacienteCNS(dados);
        btnCopiarDadosCNS.disabled = false;
        return;
    }

    if (event.data.type === "CONSULTA_CNS_ERRO") {
        btnConsultarCNS.disabled = false;
        btnConsultarCNS.textContent = "CONSULTAR DADOS";
        exibirMensagemConsultaCNS("✕ " + (event.data.mensagem || "Não foi possível concluir a consulta."), "erro");
    }
});

</script>
